plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.4.0.8496'
}

sonar {
    properties {
        property 'sonar.projectKey', 'fikua_fikua-digital-signature-service'
        property 'sonar.organization', 'fikua'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

jacoco {
    toolVersion = '0.8.13'
}

// Generate an ephemeral self-signed e-seal for tests so we never depend on
// any real cert material at build time. The keys live under build/ and are
// wiped together with the rest of the build output. Implemented as a custom
// task class so we can use Gradle 9's ExecOperations service.
abstract class GenerateTestCerts extends DefaultTask {
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    void run() {
        def outDir = outputDir.get().asFile
        outDir.mkdirs()
        generate(outDir, 'mock-eseal', '/C=ES/O=Fikua/CN=Fikua Test e-Seal')
        // Second tenant's cert, used by multi-tenant isolation tests.
        generate(outDir, 'tenant-b-eseal', '/C=ES/O=Tenant B/CN=Tenant B Test e-Seal')
    }

    private void generate(File outDir, String basename, String subject) {
        def crt = new File(outDir, "${basename}.crt")
        def key = new File(outDir, "${basename}.key")
        if (crt.exists() && key.exists()) {
            return
        }
        execOperations.exec {
            commandLine 'openssl', 'req', '-x509',
                    '-newkey', 'ec',
                    '-pkeyopt', 'ec_paramgen_curve:P-256',
                    '-keyout', key.absolutePath,
                    '-out', crt.absolutePath,
                    '-sha256', '-days', '3650', '-nodes',
                    '-subj', subject
        }
    }
}

tasks.register('prepareTestCerts', GenerateTestCerts) {
    outputDir = layout.buildDirectory.dir('test-certs')
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'prepareTestCerts'
    finalizedBy 'jacocoTestReport'   // generate the report after tests run
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true          // required by SonarCloud
        html.required = true         // handy when reviewing locally
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        // Spring Boot main class — exercised by the framework, no unit value.
                        'com/fikua/dss/DssApplication.class',
                        // Pure DTOs / records: covered transitively through controllers.
                        'com/fikua/dss/dto/**'
                ])
            })
    )
}

group = 'com.fikua'
// The release version: the v<version> tag must match it (checked below), and it
// becomes the jar's version and the telemetry's service.version (build-info).
version = '0.7.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    // OpenTelemetry Spring Boot starter: traces, metrics and logs over OTLP/HTTP
    // with the semantic-convention names the Collector's allow list expects
    // (fikua-docs conv-observability.md, OBS-02, OBS-10).
    implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.34.0')
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    // EU DSS (European Commission): signatures and, later, trust lists.
    implementation platform('eu.europa.ec.joinup.sd-dss:dss-bom:6.5.1')
    implementation 'eu.europa.ec.joinup.sd-dss:dss-token'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-jades'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-cades'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-cms-object'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-utils-apache-commons'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.87'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    // Validates the signatures the tests produce, with the default policy.
    testImplementation 'eu.europa.ec.joinup.sd-dss:dss-validation'
    testImplementation 'eu.europa.ec.joinup.sd-dss:dss-policy-jaxb'
}

springBoot {
    // META-INF/build-info.properties: the OpenTelemetry starter reads
    // service.version from it.
    buildInfo()
}

// A release tag must carry this build's version, so the image, its logs and its
// telemetry agree on it.
tasks.register('checkReleaseVersion') {
    def refType = providers.environmentVariable('GITHUB_REF_TYPE').getOrElse('')
    def refName = providers.environmentVariable('GITHUB_REF_NAME').getOrElse('')
    def expected = "v${project.version}"
    doLast {
        if (refType == 'tag' && refName != expected) {
            throw new GradleException("tag ${refName} does not match build.gradle version ${expected}")
        }
    }
}
tasks.named('build') { dependsOn 'checkReleaseVersion' }

