spring:
  application:
    name: fikua-digital-signature-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:9090}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Users and their credentials (CSC v2). A user is an OAuth2 client
# (client_credentials) and owns one or more credentials: a certificate with its
# private key, unlocked with the credential's password. Configured with indexed
# environment variables, which replace this whole list:
#   DSS_USERS_<n>_CLIENT_ID, DSS_USERS_<n>_CLIENT_SECRET,
#   DSS_USERS_<n>_CREDENTIALS_<m>_ID, ..._PASSWORD,
#   ..._CERTIFICATE_CERT_PATH, ..._CERTIFICATE_KEY_PATH
# The default is a local development user.
dss:
  users:
    - client-id: mock-client
      client-secret: mock-secret
      credentials:
        - id: mock-credential-001
          password: mock-password
          certificate:
            cert-path: file:/certs/mock-eseal-chain.pem
            key-path: file:/certs/mock-eseal.key
  token-ttl-seconds: ${TOKEN_TTL:3600}
  sad-ttl-seconds: ${SAD_TTL:300}

# Actuator on an internal management port (Traefik routes only the server
# port): its health details name users and certificates. The public
# GET /health is HealthController, in the OBS-17 format, statuses only.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,certificate
        liveness:
          include: livenessState
  info:
    git:
      mode: simple
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Fikua Digital Signature Service (CSC v2 mock QTSP)

# OpenAPI / Swagger UI
# Off unless SPRINGDOC_ENABLED=true (local development): in production the
# spec and the UI would publish the whole API to anyone.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# OpenTelemetry Spring Boot starter (fikua-docs conv-observability.md). Each
# signal is exported over OTLP/HTTP only when its OTEL_*_EXPORTER is otlp; the
# deployment sets those and OTEL_EXPORTER_OTLP_ENDPOINT. service.version comes
# from META-INF/build-info.properties (build.gradle).
otel:
  service:
    name: ${spring.application.name}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  instrumentation:
    common:
      logging:
        # Values travel as SLF4J key-value pairs (log.atInfo().addKeyValue(...)):
        # each one becomes a log attribute, a column in OpenObserve (OBS-08).
        structured-attributes:
          included: "*"
    logback-appender:
      experimental:
        mdc-attributes:
          included: request_id

logging:
  level:
    root: INFO
    com.fikua.dss: INFO
    org.springframework: WARN
    org.springframework.boot.autoconfigure: WARN
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    io.opentelemetry: WARN
    io.micrometer: WARN
    sun.net: WARN
    org.springdoc: WARN
